<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
<title id="title">The CSAW workflow</title>
<desc id="description">Workflow diagram showing six parallel category agents for cryptography, forensics, web, binary exploitation, reverse engineering, and miscellaneous challenges. Their candidate outputs feed review of solver and service evidence, with adversarial verification or second-model analysis for selected hard cases. The output is a per-challenge record of a recovery or blocker, execution evidence, and assistance history. Review paths varied by challenge.</desc>
<rect width="1280" height="760" fill="#F7F5EE"/>
<text x="64" y="74" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#23382F" text-anchor="start">The CSAW workflow</text>
<text x="64" y="118" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#697369" text-anchor="start">Parallel category agents, review, and per-challenge evidence</text>
<text x="64" y="185" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#23382F" text-anchor="start">Six parallel agents</text>
