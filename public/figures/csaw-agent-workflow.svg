<rect x="64" y="402" width="284" height="48" rx="4" fill="#FDFCF7" stroke="#DADFD4" stroke-width="1.2"/>
<text x="82" y="435" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#23382F" text-anchor="start">Binary exploitation</text>
