<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 548" width="820" height="548" role="img" aria-labelledby="title desc">
  <title id="title">RoomWise: from a shopping request to a room preview</title>
  <desc id="desc">A shopper refines a request in chat and selects a chair from retailer listings. The iPhone room preview scales a schematic chair to the selected product's dimensions. The Compose desktop app and SwiftUI iPhone app can synchronize the selection in either direction over local Wi-Fi. They share Kotlin product and geometry models.</desc>
  <style>
    text {fill:#21332e;font-family:Arial,Helvetica,sans-serif}
    .heading {font:36px Georgia,serif}
    .stage {font:24px Georgia,serif}
    .body {font-size:18px}
    .minor {font-size:16px;fill:#3e534b}
    .ink {fill:none;stroke:#263c34;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .green {fill:none;stroke:#286144;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#286144" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="820" height="548" fill="#faf8f1"/>
  <text class="heading" x="34" y="59">RoomWise</text>
  <path d="M35 82H785" stroke="#b5beb2"/>
  <g class="ink" aria-hidden="true">
    <path d="M62 111h72a9 9 0 0 1 9 9v26a9 9 0 0 1-9 9H91l-17 11v-11H62a9 9 0 0 1-9-9v-26a9 9 0 0 1 9-9z" fill="#faf8f1"/>
    <path d="M67 125h58m-58 12h39" stroke="#286144"/>
    <path d="M104 167h41l13 8v-8h4a7 7 0 0 0 7-7v-21a7 7 0 0 0-7-7h-9" stroke="#64756a"/>
    <path d="M333 123v-9a3 3 0 0 1 3-3h78a3 3 0 0 1 3 3v46m-75-31v-9h84v48"/>
    <rect x="351" y="129" width="84" height="50" rx="2" fill="#e5ecdf"/>
    <path d="M365 142v14h22v-14m-21 15v8m19-8v8m-19-22h20m10 3h27m-27 9h20" stroke="#286144"/>
    <path d="M614 169v-45l40-13 71 17v43l-44 13z" fill="#e9eee3"/>
    <path d="m614 169 40-15 71 17m-71-60v43" stroke="#819080"/>
    <path d="m646 156 14 4 16-5-14-4zM646 156v9m13-4v8m16-14v8m-29-7v-13l16-5v13" stroke="#286144"/>
  </g>
  <g class="green" marker-end="url(#arrow)" aria-hidden="true"><path d="M192 147H304"/><path d="M467 147H581"/></g>
  <text class="stage" x="35" y="222">Refine a request</text>
  <text class="body" x="35" y="251">The chat keeps track of</text>
  <text class="body" x="35" y="275">preferences across turns.</text>
  <text class="stage" x="302" y="222">Choose a listing</text>
  <text class="body" x="302" y="251">Swipe through chairs</text>
  <text class="body" x="302" y="275">from different retailers.</text>
  <text class="stage" x="559" y="222">Preview the chair</text>
  <text class="body" x="559" y="251">Its dimensions set the size</text>
  <text class="body" x="559" y="275">of the model in the room.</text>
  <path d="M35 308H785" stroke="#b5beb2"/>
  <text class="stage" x="35" y="349">Optional local pairing</text>
  <g class="ink" aria-hidden="true">
    <rect x="43" y="378" width="73" height="43" rx="3"/>
    <path d="M33 429h93m-55-7v5m15-5v5"/>
    <rect x="576" y="372" width="30" height="54" rx="5"/>
    <path d="M586 419h10"/>
  </g>
  <text class="body" x="143" y="398">Desktop</text>
  <text class="minor" x="143" y="422">Compose</text>
  <text class="body" x="627" y="398">iPhone</text>
  <text class="minor" x="627" y="422">SwiftUI / ARKit</text>
  <path class="green" d="M233 403H547" marker-start="url(#arrow)" marker-end="url(#arrow)" aria-hidden="true"/>
  <text class="minor" x="390" y="389" text-anchor="middle">Selected product</text>
  <text class="minor" x="390" y="428" text-anchor="middle">Local Wi-Fi</text>
  <path d="M79 450v12h509v-12m-245 12v15" class="ink" style="stroke:#89968c;stroke-width:1.5"/>
  <text class="body" x="344" y="507" text-anchor="middle">Shared Kotlin product and geometry models</text>
</svg>
