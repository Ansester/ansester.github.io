<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" role="img" aria-labelledby="title description">
<title id="title">Direct forecasts of group efficiency</title>
<desc id="description">Horizontal bar chart of direct-forecast error across 20 validation public-goods game designs. The target is mean group efficiency in the punishment arm. RMSE in percentage points, lower is better: Claude Haiku 4.5, 6.21; Claude Sonnet 4.5, 6.62; Claude Sonnet 5.5, 6.65; GPT-5, 9.28; expert crowd, 6.55; lay crowd, 6.42; published elastic net, 4.52; published ordinary regression, 5.22. GPT-5 stopped at its spending ceiling with 235 usable replies, 4 to 17 per design. Sonnet 5.5 was trained after the study results were public. Human forecast scores were recalculated from archived data; regression scores are published.</desc>
<rect width="1280" height="1160" fill="#F7F5EE"/>
